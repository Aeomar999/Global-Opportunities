services:
  vector:
    image: timberio/vector:0.45.0-alpine
    container_name: platform-vector
    restart: unless-stopped
    environment:
      - BETTERSTACK_LOG_TOKEN=${BETTERSTACK_LOG_TOKEN:-}
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - vector_data:/var/lib/vector
    networks:
      - edge
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  vector_data:

networks:
  edge:
    name: edge
    external: true
