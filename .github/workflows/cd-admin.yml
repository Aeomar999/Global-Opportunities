name: CD Admin

on:
  push:
    branches: [main]
    paths:
      - 'kredibble-admin/**'
      - '.nvmrc'
      - '.github/workflows/cd-admin.yml'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target deployment environment'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - staging
          - production

concurrency:
  group: cd-admin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify (lint, typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kredibble-admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: kredibble-admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Verify production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: /api
          API_PROXY_TARGET: https://kredibble-api.onrender.com/api

  deploy-staging:
    name: Deploy to Staging (Vercel)
    needs: verify
    if: inputs.target_env != 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kredibble-admin
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check Vercel credentials
        id: creds
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice title=Admin staging deploy skipped::Set VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID secrets to deploy to Vercel."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: kredibble-admin/package-lock.json
      - if: steps.creds.outputs.ready == 'true'
        run: npm install --global vercel@59
        working-directory: .
      - if: steps.creds.outputs.ready == 'true'
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - if: steps.creds.outputs.ready == 'true'
        run: vercel build --token="$VERCEL_TOKEN"
      - if: steps.creds.outputs.ready == 'true'
        id: deploy-staging
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Staging deployed: $url"

  deploy-production:
    name: Deploy to Production (Vercel)
    needs: [verify, deploy-staging]
    if: always() && needs.verify.result == 'success' && (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped') && inputs.target_env != 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Production
    defaults:
      run:
        working-directory: kredibble-admin
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check Vercel credentials
        id: creds
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice title=Admin production deploy skipped::Set VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID secrets to deploy to Vercel."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: kredibble-admin/package-lock.json
      - if: steps.creds.outputs.ready == 'true'
        run: npm install --global vercel@59
        working-directory: .
      - if: steps.creds.outputs.ready == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - if: steps.creds.outputs.ready == 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - if: steps.creds.outputs.ready == 'true'
        id: deploy-prod
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployed: $url"
