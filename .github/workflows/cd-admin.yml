name: CD Admin

on:
  push:
    branches: [main, staging, dev]
    paths:
      - 'kredibble-admin/**'
      - '.nvmrc'
      - '.github/workflows/cd-admin.yml'
  workflow_dispatch:

concurrency:
  group: cd-admin-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify (lint, typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kredibble-admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: kredibble-admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Verify production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: /api
          API_PROXY_TARGET: https://kredibble-api.onrender.com/api

  deploy:
    name: Deploy to Vercel
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: 
      name: ${{ github.ref == 'refs/heads/main' && 'Production' || github.ref == 'refs/heads/staging' && 'Staging' || 'Development' }}
    defaults:
      run:
        working-directory: kredibble-admin
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEXT_TELEMETRY_DISABLED: 1
      # Set Vercel deployment environment based on branch
      VERCEL_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - name: Check Vercel credentials
        id: creds
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice title=Admin deploy skipped::Set the VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID repository secrets to deploy the admin."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: kredibble-admin/package-lock.json
      - if: steps.creds.outputs.ready == 'true'
        run: npm install --global vercel@59
        working-directory: .
      - if: steps.creds.outputs.ready == 'true'
        run: vercel pull --yes --environment=${{ env.VERCEL_ENV }} --token="$VERCEL_TOKEN"
      - if: steps.creds.outputs.ready == 'true' && env.VERCEL_ENV == 'production'
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - if: steps.creds.outputs.ready == 'true' && env.VERCEL_ENV == 'preview'
        run: vercel build --token="$VERCEL_TOKEN"
      - if: steps.creds.outputs.ready == 'true' && env.VERCEL_ENV == 'production'
        id: deploy-prod
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $url"
      - if: steps.creds.outputs.ready == 'true' && env.VERCEL_ENV == 'preview'
        id: deploy-preview
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $url"
