name: CD Backend

on:
  push:
    branches: [main]
    paths:
      - 'kredibble-backend/**'
      - 'deploy/**'
      - 'scripts/smoke.mjs'
      - '.nvmrc'
      - '.github/workflows/cd-backend.yml'
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to deploy or rollback to (defaults to trigger SHA)'
        required: false
        default: ''
      target_env:
        description: 'Target environment for manual deployment'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - staging
          - production

# Never run two deploys of the backend at once; let an in-flight one finish.
concurrency:
  group: cd-backend
  cancel-in-progress: false

permissions:
  contents: read

env:
  MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries

jobs:
  verify:
    name: Verify (lint, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kredibble-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: kredibble-backend/package-lock.json
      - uses: actions/cache@v6
        with:
          path: .mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('kredibble-backend/package-lock.json') }}
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm test -- --ci

  image:
    name: Build and push image (GHCR)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      release_sha: ${{ steps.resolve.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v7
      - id: resolve
        run: |
          TARGET_SHA="${{ inputs.sha }}"
          if [ -z "$TARGET_SHA" ]; then
            TARGET_SHA="${{ github.sha }}"
          fi
          echo "release_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "Target Release SHA: $TARGET_SHA"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # metadata-action lowercases the image name; GHCR rejects mixed-case repository names.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/kredibble-backend
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.resolve.outputs.release_sha }}
      - uses: docker/build-push-action@v7
        with:
          context: kredibble-backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RELEASE_SHA=${{ steps.resolve.outputs.release_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging (VPS)
    needs: [verify, image]
    if: inputs.target_env != 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      skipped: ${{ steps.deploy.outputs.skipped }}
    steps:
      - name: Deploy to VPS staging via SSH
        id: deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ needs.image.outputs.release_sha }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::notice title=Staging VPS deploy skipped::Set VPS_HOST, VPS_SSH_KEY and VPS_KNOWN_HOSTS repository secrets to deploy to the VPS."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            echo "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
          fi
          eval "$(ssh-agent -s)"
          echo "$VPS_SSH_KEY" | tr -d '\r' | ssh-add -
          ssh -o BatchMode=yes deploy@"$VPS_HOST" "deploy staging $RELEASE_SHA"

  smoke-staging:
    name: Smoke test (Staging)
    needs: [image, deploy-staging]
    if: needs.deploy-staging.outputs.skipped != 'true' && inputs.target_env != 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Run smoke test against Staging API
        env:
          RELEASE_SHA: ${{ needs.image.outputs.release_sha }}
        run: |
          node scripts/smoke.mjs "https://staging-api.globalopportunitydesk.com" "$RELEASE_SHA" "staging"

  deploy-production:
    name: Deploy to Production (VPS)
    needs: [image, smoke-staging]
    if: always() && needs.image.result == 'success' && (needs.smoke-staging.result == 'success' || needs.smoke-staging.result == 'skipped') && inputs.target_env != 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    steps:
      - name: Deploy to VPS production via SSH
        id: deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ needs.image.outputs.release_sha }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::notice title=Production VPS deploy skipped::Set VPS_HOST, VPS_SSH_KEY and VPS_KNOWN_HOSTS repository secrets to deploy to the VPS."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            echo "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
          fi
          eval "$(ssh-agent -s)"
          echo "$VPS_SSH_KEY" | tr -d '\r' | ssh-add -
          ssh -o BatchMode=yes deploy@"$VPS_HOST" "deploy production $RELEASE_SHA"

      - uses: actions/checkout@v7
        if: steps.deploy.outputs.skipped != 'true'
      - uses: actions/setup-node@v7
        if: steps.deploy.outputs.skipped != 'true'
        with:
          node-version-file: .nvmrc
      - name: Run smoke test against Production API
        if: steps.deploy.outputs.skipped != 'true'
        env:
          RELEASE_SHA: ${{ needs.image.outputs.release_sha }}
        run: |
          node scripts/smoke.mjs "https://api.globalopportunitydesk.com" "$RELEASE_SHA" "production"

  deploy-render:
    name: Trigger Render deploy (Transition)
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice title=Render deploy skipped::RENDER_DEPLOY_HOOK_URL is not set. Render's own GitHub auto-deploy (if enabled) still deploys main."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Render deploy triggered."
