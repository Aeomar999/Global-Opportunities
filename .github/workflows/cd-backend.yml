name: CD Backend

on:
  push:
    branches: [ "main" ]
    paths:
      - 'kredibble-backend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./kredibble-backend
        push: true
        tags: ghcr.io/${{ github.repository }}/kredibble-backend:latest
        
    - name: Trigger Deployment
      run: echo "Call webhook to trigger deployment (e.g. Render, Railway, AWS)"
